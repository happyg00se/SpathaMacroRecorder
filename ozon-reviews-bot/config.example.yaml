# Скопируй этот файл в config.yaml и заполни. config.yaml в git не попадает.

# ─── Откуда брать отзывы и вопросы ───────────────────────────────────────────
# browser — бесплатно: бот сам работает в кабинете seller.ozon.ru через Chrome на твоём компьютере.
# api     — через Ozon Seller API. Отзывы в API Ozon даёт только с платной подпиской Premium Plus/Pro.
source: browser

# Нужно только для source: api
ozon_api:
  client_id: ""
  api_key: ""

browser:
  profile_dir: data/chrome-profile # отдельный профиль Chrome, логинишься в него один раз командой `login`
  channel: chrome                  # chrome — установленный Google Chrome; пусто — встроенный Chromium
  executable_path: ""              # путь к chrome.exe, если Chrome стоит в нестандартной папке
  headless: false                  # true — совсем без окна (Ozon такое иногда блокирует, начни с false)
  hide_window: true                # окно Chrome открыто, но спрятано за край экрана и не мешает
  restart_hours: 6                 # раз в столько часов Chrome перезапускается, чтобы не копил память
  reviews_url: https://seller.ozon.ru/app/reviews
  questions_url: https://seller.ozon.ru/app/questions
  # Селекторы кабинета. Ozon периодически меняет вёрстку — если бот перестал видеть отзывы,
  # запусти `python -m ozon_bot diagnose` и поправь селекторы по сохранённой странице.
  selectors:
    card: "[data-review-uuid], [data-question-id], [class*='review-card'], [class*='question-card']"
    id_attrs: ["data-review-uuid", "data-question-id", "data-id"]
    text: "[class*='text'], [class*='comment']"
    product: "[class*='product-name'], [class*='productName'], [class*='title']"
    rating: "[class*='rating']"
    reply_button: "button:has-text('Ответить')"
    reply_input: "textarea"
    send_button: "button:has-text('Отправить'), button:has-text('Опубликовать')"

# ─── Что проверять и как часто ───────────────────────────────────────────────
check_reviews: true
check_questions: true
poll_minutes: 15
max_items_per_check: 30

# ─── Локальная нейросеть ─────────────────────────────────────────────────────
# Любой сервер с OpenAI-совместимым API: Ollama, LM Studio, llama.cpp, vLLM.
#   Ollama:    http://localhost:11434/v1   (модель: ollama pull qwen2.5:7b)
#   LM Studio: http://localhost:1234/v1
llm:
  base_url: http://localhost:11434/v1
  model: qwen2.5:7b                # под 8 ГБ видеопамяти; при 12+ ГБ — qwen2.5:14b
  api_key: ""                      # для локальных серверов не нужен
  temperature: 0.4
  timeout_seconds: 300
  json_mode: true                  # если сервер ругается на response_format — поставь false

# ─── Telegram ────────────────────────────────────────────────────────────────
telegram:
  token: "123456789:AA..."          # от @BotFather
  # Кому бот подчиняется. Узнать свой id: напиши боту /start — он ответит твоим chat id.
  allowed_chat_ids: [111111111]

# ─── Когда публиковать без спроса ────────────────────────────────────────────
# all    — всё публикуется само, в Telegram приходит отчёт
# safe   — позитив и нейтраль публикуются сами, негатив и сложные случаи — на кнопки в Telegram
# manual — ничего не публикуется без твоей кнопки
auto_publish: safe
# Отзыв без текста (только звёзды): thank — короткое «спасибо», skip — не отвечать
empty_review: thank

# ─── О магазине: из этого нейросеть собирает ответ ───────────────────────────
shop:
  name: "Мой магазин"
  about: "Продаём виниловые и UV DTF наклейки для декора и творчества."
  signature: "С уважением, команда «Мой магазин»"
  # Как клиенту с нами связаться. Ozon запрещает телефоны, ссылки и мессенджеры в ответах — только чат Ozon.
  contact: "напишите нам в чат с продавцом на Ozon — поможем разобраться"
  max_reply_chars: 900

# Правила тона. Дописывай своё — нейросеть их прочтёт перед каждым ответом.
style_rules:
  - "Обращайся к покупателю на «вы», тепло и по-человечески, без канцелярита."
  - "Отвечай на то, что человек реально написал: упомяни его конкретную ситуацию."
  - "Если товар не подошёл или разочаровал — извинись, что не оправдали ожиданий, и предложи написать в чат продавца."
  - "Не спорь с покупателем и не обвиняй его, даже если он неправ."
  - "Не обещай возврат денег, компенсации и скидки — это решается в чате."
  - "Благодари за положительный отзыв и фото, приглашай снова."
  - "Не используй смайлики, кроме одного уместного в позитивных ответах."

# Примеры «отзыв → идеальный ответ». Чем больше живых примеров, тем точнее нейросеть попадает в твой стиль.
examples:
  - text: "Наклейки не подошли, размер оказался меньше, чем я думал."
    reply: "Здравствуйте! Нам очень жаль, что наклейки не подошли по размеру и мы не оправдали ваших ожиданий. Напишите нам, пожалуйста, в чат с продавцом — подскажем точные размеры и поможем подобрать вариант, который подойдёт именно вам."
  - text: "Наклейки очень плохого качества, края отклеиваются через день."
    reply: "Здравствуйте! Очень жаль, что качество наклеек вас разочаровало — мы такого не хотели. Напишите нам, пожалуйста, в чат с продавцом и приложите фото: разберёмся, в чём причина, и обязательно поможем."
  - text: "Всё супер, яркие, клеятся отлично, ребёнок в восторге!"
    reply: "Здравствуйте! Спасибо за такой тёплый отзыв — очень рады, что наклейки понравились и порадовали ребёнка. Будем рады видеть вас снова!"

# Где хранить базу обработанных отзывов
data_dir: data
